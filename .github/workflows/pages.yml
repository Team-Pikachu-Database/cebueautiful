name: Deploy CebuStays to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.CEBUSTAYS_API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build:pages
        env:
          CEBUSTAYS_API_BASE_URL: ${{ vars.CEBUSTAYS_API_BASE_URL }}
          CEBUSTAYS_SITE_DOMAIN: www.pikachubookingsite.com
          REQUIRE_CEBUSTAYS_API: "true"

      - name: Verify the hosted API before publishing
        run: |
          response="$(curl --fail --silent --show-error "$CEBUSTAYS_API_BASE_URL/api/health")"
          printf '%s' "$response" | jq -e '.status == "ok"'
        env:
          CEBUSTAYS_API_BASE_URL: ${{ vars.CEBUSTAYS_API_BASE_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
